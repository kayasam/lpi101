<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title desc"><title id="title">Du programme au matériel</title><desc id="desc">Les couches de Linux, du plus visible au plus proche de la machine.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#007E87"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#AD5B18"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="998" height="898" rx="24" fill="#FBFCFE" stroke="#D9E4EC"/><text x="40" y="49" font-size="16" fill="#007E87" font-weight="700" text-anchor="start">LPI 101  /  REPÈRE VISUEL</text><text x="40" y="96" font-size="34" fill="#182D42" font-weight="700" text-anchor="start">Du programme au matériel</text><text x="40" y="132" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Les couches de Linux, du plus visible au plus proche de la machine.</text><rect x="40" y="164" width="920" height="307" rx="20" fill="#EEF5FC" stroke="#C9DCEE"/><rect x="62" y="182" width="240" height="34" rx="17" fill="#DEEBFA" stroke="#DEEBFA"/><text x="182.0" y="206" font-size="18" fill="#306CB5" font-weight="600" text-anchor="middle">ESPACE UTILISATEUR</text><rect x="62" y="236" width="272" height="104" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="82" y="270" font-size="25" fill="#182D42" font-weight="700" text-anchor="start">Shell</text><text x="82" y="300" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Bash interprète</text><text x="82" y="326" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">les commandes.</text><rect x="356" y="236" width="272" height="104" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="376" y="270" font-size="25" fill="#182D42" font-weight="700" text-anchor="start">Applications</text><text x="376" y="300" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Éditeur, navigateur,</text><text x="376" y="326" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">outils du quotidien.</text><rect x="650" y="236" width="272" height="104" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="670" y="270" font-size="25" fill="#182D42" font-weight="700" text-anchor="start">Services</text><text x="670" y="300" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Programmes actifs</text><text x="670" y="326" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">en arrière-plan.</text><path d="M490 345 V375" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="62" y="388" width="860" height="60" rx="12" fill="#FFFFFF" stroke="#C9DCEE"/><text x="82" y="427" font-size="23" fill="#182D42" font-weight="650" text-anchor="start">Bibliothèques</text><text x="285" y="427" font-size="22" fill="#52677B" font-weight="400" text-anchor="start">Fonctions réutilisables par les programmes</text><path d="M490 474 V519" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="520" y="505" font-size="21" fill="#007E87" font-weight="600" text-anchor="start">Appels système</text><rect x="40" y="536" width="920" height="152" rx="20" fill="#E4F3F3" stroke="#ABD3D5"/><text x="64" y="575" font-size="20" fill="#007E87" font-weight="750" text-anchor="start">NOYAU LINUX</text><text x="64" y="613" font-size="23" fill="#182D42" font-weight="400" text-anchor="start">Il gère les processus, la mémoire et les accès au matériel.</text><rect x="64" y="635" width="300" height="34" rx="17" fill="#FFFFFF" stroke="#FFFFFF"/><text x="214.0" y="659" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">Pilotes intégrés ou modules</text><text x="389" y="660" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Ils contrôlent les périphériques.</text><path d="M490 692 V734" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="750" width="920" height="86" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="64" y="785" font-size="20" fill="#182D42" font-weight="750" text-anchor="start">MATÉRIEL</text><text x="64" y="816" font-size="23" fill="#52677B" font-weight="400" text-anchor="start">Processeur  •  Mémoire  •  Disques  •  Carte réseau</text><text x="40" y="872" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Lecture simplifiée : les programmes demandent au noyau d’agir sur la machine.</text></g></svg>