<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img" aria-labelledby="title desc"><title id="title">Un shell, des processus et un terminal</title><desc id="desc">Les PID ci-dessous sont des exemples : ils changent à chaque exécution.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#007E87"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#AD5B18"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="998" height="948" rx="24" fill="#FBFCFE" stroke="#D9E4EC"/><text x="40" y="49" font-size="16" fill="#007E87" font-weight="700" text-anchor="start">LPI 101  /  REPÈRE VISUEL</text><text x="40" y="96" font-size="34" fill="#182D42" font-weight="700" text-anchor="start">Un shell, des processus et un terminal</text><text x="40" y="132" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Les PID ci-dessous sont des exemples : ils changent à chaque exécution.</text><rect x="250" y="175" width="500" height="116" rx="18" fill="#EEF5FC" stroke="#C9DCEE"/><text x="500" y="219" font-size="29" fill="#306CB5" font-weight="700" text-anchor="middle">Bash · PID 2400</text><text x="500" y="257" font-size="22" fill="#52677B" font-weight="400" text-anchor="middle">Le shell lance les commandes externes.</text><path d="M500 298 V336 M270 336 H730 M270 336 V379" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M730 336 V379" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="395" width="445" height="220" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="62" y="441" font-size="31" fill="#182D42" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">sleep 60</text><text x="62" y="483" font-size="25" fill="#007E87" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">PID 2401  ·  PPID 2400</text><text x="62" y="533" font-size="19" fill="#306CB5" font-weight="700" text-anchor="start">PREMIER PLAN</text><text x="62" y="579" font-size="24" fill="#52677B" font-weight="400" text-anchor="start">Le shell attend sa fin.</text><rect x="515" y="395" width="445" height="220" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="537" y="441" font-size="31" fill="#182D42" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">sleep 60 &amp;</text><text x="537" y="483" font-size="25" fill="#007E87" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">PID 2402  ·  PPID 2400</text><text x="537" y="533" font-size="19" fill="#306CB5" font-weight="700" text-anchor="start">ARRIÈRE-PLAN</text><text x="537" y="579" font-size="24" fill="#52677B" font-weight="400" text-anchor="start">Le shell rend la main.</text><text x="40" y="658" font-size="22" fill="#52677B" font-weight="400" text-anchor="start">Deux lancements possibles depuis le même shell.</text><rect x="40" y="698" width="920" height="139" rx="18" fill="#E4F3F3" stroke="#ABD3D5"/><text x="62" y="738" font-size="25" fill="#007E87" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">PID</text><text x="211" y="738" font-size="24" fill="#182D42" font-weight="400" text-anchor="start">Identifiant du processus.</text><text x="62" y="782" font-size="25" fill="#007E87" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">PPID</text><text x="211" y="782" font-size="24" fill="#182D42" font-weight="400" text-anchor="start">Identifiant du processus parent.</text><text x="40" y="883" font-size="22" fill="#182D42" font-weight="600" text-anchor="start">fg ramène une tâche au premier plan ; jobs affiche les tâches du shell.</text><text x="40" y="922" font-size="23" fill="#52677B" font-weight="400" text-anchor="start">En arrière-plan, la commande peut encore écrire dans le terminal.</text></g></svg>