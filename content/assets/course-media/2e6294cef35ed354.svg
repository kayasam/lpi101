<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="title desc"><title id="title">Disque, partition, système de fichiers</title><desc id="desc">Trois niveaux à distinguer avant de préparer un espace de stockage.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#007E87"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#AD5B18"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="998" height="938" rx="24" fill="#FBFCFE" stroke="#D9E4EC"/><text x="40" y="49" font-size="16" fill="#007E87" font-weight="700" text-anchor="start">LPI 101  /  REPÈRE VISUEL</text><text x="40" y="96" font-size="34" fill="#182D42" font-weight="700" text-anchor="start">Disque, partition, système de fichiers</text><text x="40" y="132" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Trois niveaux à distinguer avant de préparer un espace de stockage.</text><rect x="40" y="170" width="920" height="120" rx="18" fill="#EEF5FC" stroke="#C9DCEE"/><rect x="60" y="187" width="160" height="34" rx="17" fill="#DEEBFA" stroke="#DEEBFA"/><text x="140.0" y="211" font-size="18" fill="#306CB5" font-weight="600" text-anchor="middle">01  LE DISQUE</text><text x="60" y="262" font-size="30" fill="#182D42" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">/dev/sdb</text><text x="370" y="219" font-size="25" fill="#182D42" font-weight="650" text-anchor="start">Le périphérique de stockage</text><text x="370" y="257" font-size="23" fill="#52677B" font-weight="400" text-anchor="start">Exemple : un disque de 10 Gio.</text><path d="M500 299 V341" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="530" y="331" font-size="22" fill="#007E87" font-weight="600" text-anchor="start">Partitionner : découper l’espace</text><rect x="40" y="362" width="920" height="170" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><rect x="60" y="380" width="210" height="34" rx="17" fill="#E4F3F3" stroke="#E4F3F3"/><text x="165.0" y="404" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">02  LES PARTITIONS</text><rect x="60" y="431" width="600" height="76" rx="12" fill="#E4F3F3" stroke="#ABD3D5"/><text x="82" y="478" font-size="27" fill="#007E87" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">/dev/sdb1  ·  8 Gio</text><rect x="680" y="431" width="260" height="76" rx="12" fill="#F3F6F9" stroke="#D9E4EC"/><text x="697" y="463" font-size="24" fill="#182D42" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">/dev/sdb2</text><text x="697" y="491" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">2 Gio</text><path d="M360 539 V580" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="390" y="570" font-size="21" fill="#007E87" font-weight="600" text-anchor="start">Formater : créer une organisation pour les fichiers</text><rect x="40" y="599" width="920" height="170" rx="18" fill="#E4F3F3" stroke="#ABD3D5"/><rect x="60" y="618" width="342" height="34" rx="17" fill="#FFFFFF" stroke="#FFFFFF"/><text x="231.0" y="642" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">03  LE SYSTÈME DE FICHIERS</text><text x="60" y="699" font-size="30" fill="#007E87" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">ext4 sur /dev/sdb1</text><text x="60" y="739" font-size="23" fill="#182D42" font-weight="400" text-anchor="start">Il organise les fichiers, les répertoires et leurs métadonnées.</text><rect x="40" y="803" width="920" height="95" rx="14" fill="#FFF7EF" stroke="#E9C9AA"/><text x="62" y="838" font-size="24" fill="#AD5B18" font-weight="700" text-anchor="start">Formater peut détruire les données existantes.</text><text x="62" y="875" font-size="23" fill="#182D42" font-weight="400" text-anchor="start">Le montage vient ensuite : il donne un chemin d’accès, comme /mnt.</text></g></svg>