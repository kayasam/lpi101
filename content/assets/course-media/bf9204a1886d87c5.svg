<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="970" viewBox="0 0 1000 970" role="img" aria-labelledby="title desc"><title id="title">Deux liens, deux façons de retrouver un fichier</title><desc id="desc">Un lien physique partage un inode ; un lien symbolique contient un chemin.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#007E87"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#AD5B18"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="998" height="968" rx="24" fill="#FBFCFE" stroke="#D9E4EC"/><text x="40" y="49" font-size="16" fill="#007E87" font-weight="700" text-anchor="start">LPI 101  /  REPÈRE VISUEL</text><text x="40" y="96" font-size="34" fill="#182D42" font-weight="700" text-anchor="start">Deux liens, deux façons de retrouver un fichier</text><text x="40" y="132" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Un lien physique partage un inode ; un lien symbolique contient un chemin.</text><rect x="40" y="163" width="268" height="34" rx="17" fill="#E4F3F3" stroke="#E4F3F3"/><text x="174.0" y="187" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">01  AVANT LA SUPPRESSION</text><rect x="40" y="232" width="300" height="66" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="62" y="274" font-size="25" fill="#182D42" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">original.txt</text><rect x="40" y="320" width="300" height="66" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="62" y="362" font-size="25" fill="#182D42" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">physique.txt</text><rect x="638" y="240" width="322" height="142" rx="18" fill="#E4F3F3" stroke="#ABD3D5"/><text x="660" y="279" font-size="25" fill="#007E87" font-weight="700" text-anchor="start">Même inode : 123</text><text x="660" y="318" font-size="23" fill="#182D42" font-weight="600" text-anchor="start">Même contenu</text><text x="660" y="352" font-size="18" fill="#52677B" font-weight="400" text-anchor="start">Sur le même système de fichiers</text><path d="M347 265 H489 V294 H628" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M347 353 H489 V324 H628" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="418" width="300" height="66" rx="18" fill="#EEF5FC" stroke="#C9DCEE"/><text x="62" y="460" font-size="25" fill="#306CB5" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">raccourci.txt</text><text x="380" y="450" font-size="23" fill="#306CB5" font-weight="600" text-anchor="start">contient le chemin « original.txt »</text><text x="380" y="479" font-size="20" fill="#52677B" font-weight="400" text-anchor="start">Un fichier distinct, avec son propre inode.</text><path d="M40 451 H20 V265 H32" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="523" width="920" height="64" rx="14" fill="#142E42" stroke="#142E42"/><text x="66" y="565" font-size="26" fill="#FFFFFF" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">rm original.txt</text><rect x="40" y="616" width="268" height="34" rx="17" fill="#E4F3F3" stroke="#E4F3F3"/><text x="174.0" y="640" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">02  APRÈS LA SUPPRESSION</text><rect x="40" y="678" width="300" height="66" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="62" y="720" font-size="25" fill="#182D42" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">physique.txt</text><path d="M347 711 H628" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="638" y="678" width="322" height="66" rx="18" fill="#E4F3F3" stroke="#ABD3D5"/><text x="660" y="720" font-size="23" fill="#007E87" font-weight="650" text-anchor="start">Inode 123 : accessible</text><rect x="40" y="779" width="300" height="66" rx="18" fill="#FFF7EF" stroke="#E9C9AA"/><text x="62" y="821" font-size="25" fill="#AD5B18" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">raccourci.txt</text><path d="M347 812 H628" fill="none" stroke="#AD5B18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/><rect x="638" y="779" width="322" height="66" rx="18" fill="#FFF7EF" stroke="#E9C9AA"/><text x="660" y="821" font-size="23" fill="#AD5B18" font-weight="650" text-anchor="start">original.txt : absent</text><text x="40" y="900" font-size="24" fill="#182D42" font-weight="650" text-anchor="start">Le nom physique restant donne toujours accès au contenu.</text><text x="40" y="935" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Le lien symbolique est cassé : le chemin qu’il contient ne mène plus à la cible.</text></g></svg>