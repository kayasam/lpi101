<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="950" viewBox="0 0 1000 950" role="img" aria-labelledby="title desc"><title id="title">Monter : donner un chemin aux fichiers</title><desc id="desc">Le volume garde ses données ; un répertoire devient leur point d’accès.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#007E87"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#AD5B18"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="998" height="948" rx="24" fill="#FBFCFE" stroke="#D9E4EC"/><text x="40" y="49" font-size="16" fill="#007E87" font-weight="700" text-anchor="start">LPI 101  /  REPÈRE VISUEL</text><text x="40" y="96" font-size="34" fill="#182D42" font-weight="700" text-anchor="start">Monter : donner un chemin aux fichiers</text><text x="40" y="132" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Le volume garde ses données ; un répertoire devient leur point d’accès.</text><rect x="40" y="170" width="330" height="382" rx="20" fill="#EEF5FC" stroke="#C9DCEE"/><rect x="60" y="190" width="190" height="34" rx="17" fill="#DEEBFA" stroke="#DEEBFA"/><text x="155.0" y="214" font-size="18" fill="#306CB5" font-weight="600" text-anchor="middle">SUR LE VOLUME</text><text x="62" y="269" font-size="29" fill="#182D42" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">/dev/sdb1</text><text x="62" y="306" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Système de fichiers : ext4</text><rect x="62" y="339" width="286" height="88" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="84" y="375" font-size="25" fill="#182D42" font-weight="600" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">rapport.txt</text><text x="84" y="405" font-size="20" fill="#52677B" font-weight="400" text-anchor="start">Un fichier</text><rect x="62" y="444" width="286" height="80" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="84" y="478" font-size="25" fill="#182D42" font-weight="600" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">photos/</text><text x="84" y="507" font-size="20" fill="#52677B" font-weight="400" text-anchor="start">Un répertoire</text><rect x="550" y="170" width="410" height="382" rx="20" fill="#FFFFFF" stroke="#D9E4EC"/><rect x="570" y="190" width="290" height="34" rx="17" fill="#E4F3F3" stroke="#E4F3F3"/><text x="715.0" y="214" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">DANS L’ARBORESCENCE</text><text x="584" y="270" font-size="32" fill="#182D42" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">/</text><path d="M598 286 V439 M598 315 H627 M598 370 H627 M598 433 H627" fill="none" stroke="#A8B9C9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="644" y="323" font-size="25" fill="#52677B" font-weight="400" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">etc/</text><text x="644" y="378" font-size="25" fill="#52677B" font-weight="400" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">home/</text><rect x="628" y="403" width="290" height="113" rx="14" fill="#E4F3F3" stroke="#ABD3D5"/><text x="648" y="440" font-size="29" fill="#007E87" font-weight="750" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">mnt/</text><text x="648" y="477" font-size="21" fill="#007E87" font-weight="600" text-anchor="start">Point de montage</text><path d="M377 460 H617" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="455" y="429" font-size="23" fill="#007E87" font-weight="700" text-anchor="middle" font-family="Cascadia Code,Consolas,monospace">mount</text><rect x="40" y="584" width="920" height="86" rx="16" fill="#142E42" stroke="#142E42"/><text x="66" y="636" font-size="29" fill="#FFFFFF" font-weight="600" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">sudo mount /dev/sdb1 /mnt</text><text x="40" y="717" font-size="24" fill="#182D42" font-weight="650" text-anchor="start">Après le montage, on accède aux fichiers par ces chemins :</text><rect x="40" y="740" width="445" height="70" rx="12" fill="#FFFFFF" stroke="#D9E4EC"/><text x="62" y="784" font-size="27" fill="#007E87" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">/mnt/rapport.txt</text><rect x="505" y="740" width="455" height="70" rx="12" fill="#FFFFFF" stroke="#D9E4EC"/><text x="527" y="784" font-size="27" fill="#007E87" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">/mnt/photos/</text><rect x="40" y="841" width="920" height="72" rx="14" fill="#FFF7EF" stroke="#E9C9AA"/><text x="62" y="871" font-size="23" fill="#AD5B18" font-weight="700" text-anchor="start">Monter ne copie pas les fichiers.</text><text x="62" y="899" font-size="21" fill="#182D42" font-weight="400" text-anchor="start">Démonter enlève cet accès ; les données restent sur le volume.</text></g></svg>