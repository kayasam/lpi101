# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Linux : initiation et préparation LPI 101"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: fr-FR
  baseUrl: kayasam.github.io/lpi101
  ignorePatterns:
    - telechargements/**
    - private
    - templates
    - .obsidian
    - cours/**/*.excalidraw
    - cours/**/*.excalidraw.md
  theme:
    # Même police système que le coffre Obsidian sous Windows.
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Segoe UI
      body: Segoe UI
      code: Cascadia Code
    colors:
      lightMode:
        light: "#f8fafc"
        lightgray: "#dbe7f0"
        gray: "#7c94a8"
        darkgray: "#40566a"
        dark: "#10283a"
        secondary: "#007a87"
        tertiary: "#d06b22"
        highlight: rgba(0, 122, 135, 0.12)
        textHighlight: "#f7cf5a66"
      darkMode:
        light: "#07151d"
        lightgray: "#18313d"
        gray: "#658292"
        darkgray: "#bad0dc"
        dark: "#effaff"
        secondary: "#52d2dd"
        tertiary: "#ff9b55"
        highlight: rgba(82, 210, 221, 0.14)
        textHighlight: "#e7bd3d55"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: absolute
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    # Désactivé : ce plugin remplaçait Segoe UI par des polices Google.
    enabled: false
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    options:
      mapFn: >-
        function(node) {}
      sortFn: >-
        function(a,b) { const rank = {"lpi101/index": 0, "complements/index": 1, "lpi101/01-comprendre-gnu-linux/index": 0, "lpi101/02-distributions/index": 1, "lpi101/03-architecture-linux/index": 2, "lpi101/04-preparer-installation/index": 3, "lpi101/05-installation-machine-virtuelle/index": 4, "lpi101/06-acceder-et-configurer/index": 5, "lpi101/07-premieres-commandes/index": 6, "lpi101/08-chemins-et-navigation/index": 7, "lpi101/09-lire-fichiers/index": 8, "lpi101/10-manipuler-fichiers/index": 9, "lpi101/11-jokers-et-recherche/index": 10, "lpi101/12-liens/index": 11, "lpi101/13-archives-compression/index": 12, "lpi101/14-environnement-shell/index": 13, "lpi101/15-flux-redirections/index": 14, "lpi101/16-filtres-textuels/index": 15, "lpi101/17-expressions-regulieres/index": 16, "lpi101/18-editeurs-texte/index": 17, "lpi101/19-utilisateurs-groupes/index": 18, "lpi101/20-permissions/index": 19, "lpi101/21-umask-bits-speciaux/index": 20, "lpi101/22-processus/index": 21, "lpi101/23-priorites/index": 22, "lpi101/24-arborescence-fhs/index": 23, "lpi101/25-concevoir-partitionnement/index": 24, "lpi101/26-partitions-formatage/index": 25, "lpi101/27-montage-fstab/index": 26, "lpi101/28-espace-disque-inodes/index": 27, "lpi101/29-integrite-maintenance/index": 28, "lpi101/30-paquets-debian/index": 29, "lpi101/31-paquets-rpm/index": 30, "lpi101/32-bibliotheques/index": 31, "lpi101/33-materiel-modules/index": 32, "lpi101/34-evenements-materiels/index": 33, "lpi101/35-demarrage-arret/index": 34, "lpi101/36-services/index": 35, "lpi101/37-journaux/index": 36, "lpi101/38-grub-recuperation/index": 37, "lpi101/39-ssh/index": 38, "complements/01-acl/index": 39, "complements/02-lvm/index": 40, "complements/03-premiers-scripts/index": 41, "complements/04-conditions-boucles/index": 42, "complements/05-scripts-utilitaires/index": 43, "complements/06-wsl/index": 44, "complements/07-cloud-init/index": 45, "complements/08-personnaliser-terminal/index": 46, "complements/09-reperes-certification/index": 47}; return (rank[a.slug] ?? 999) - (rank[b.slug] ?? 999) || a.displayName.localeCompare(b.displayName, "fr", {numeric:true}); }
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: false
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links: {}
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: false
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      positions:
        right:
          - table-of-contents
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
