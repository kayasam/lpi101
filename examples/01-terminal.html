<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorer le terminal</title>
<link rel="stylesheet" href="{{BASE_URL}}/assets/themes/theme.css"><script src="{{BASE_URL}}/assets/themes/theme.js"></script>
<style>body{font:17px/1.7 system-ui;margin:0;padding:1.5rem;color:var(--text,#213547);background:var(--bg,#fff)}main{max-width:760px;margin:auto}h1{line-height:1.2}button{font:inherit;min-height:44px;padding:.6rem 1rem;border:1px solid currentColor;border-radius:8px;background:transparent;color:inherit;cursor:pointer}pre{padding:1rem;border:1px solid #788a99;border-radius:8px;white-space:pre-wrap}button:focus-visible{outline:3px solid #007a87;outline-offset:3px}</style></head>
<body><main><h1>Une commande, un résultat</h1><p>Teste ces commandes dans ce terminal simulé. Ton ordinateur reste inchangé.</p><nav aria-label="Commandes à essayer"><button data-command="pwd">pwd</button> <button data-command="echo">echo</button></nav><pre aria-live="polite" id="result">Choisis une commande.</pre></main><script>document.querySelectorAll('[data-command]').forEach(button=>button.addEventListener('click',()=>{document.getElementById('result').textContent=button.dataset.command==='pwd'?'$ pwd\n/home/apprenant':'$ echo "Bonjour le terminal"\nBonjour le terminal'}))</script></body></html>
