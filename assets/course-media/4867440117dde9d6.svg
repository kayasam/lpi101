<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1040" viewBox="0 0 1000 1040" role="img" aria-labelledby="title desc"><title id="title">Du bouton de démarrage à la connexion</title><desc id="desc">Un démarrage courant sur un PC Debian avec UEFI, GRUB et systemd.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#007E87"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#AD5B18"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="998" height="1038" rx="24" fill="#FBFCFE" stroke="#D9E4EC"/><text x="40" y="49" font-size="16" fill="#007E87" font-weight="700" text-anchor="start">LPI 101  /  REPÈRE VISUEL</text><text x="40" y="96" font-size="34" fill="#182D42" font-weight="700" text-anchor="start">Du bouton de démarrage à la connexion</text><text x="40" y="132" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Un démarrage courant sur un PC Debian avec UEFI, GRUB et systemd.</text><rect x="40" y="172" width="920" height="108" rx="18" fill="#EEF5FC" stroke="#D9E4EC"/><rect x="61" y="192" width="46" height="34" rx="17" fill="#E4F3F3" stroke="#E4F3F3"/><text x="84.0" y="216" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">1</text><text x="131" y="215" font-size="28" fill="#182D42" font-weight="700" text-anchor="start">UEFI</text><text x="131" y="252" font-size="22" fill="#52677B" font-weight="400" text-anchor="start">Le firmware initialise le matériel et lance le chargeur.</text><path d="M500 287 V309" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="318" width="920" height="108" rx="18" fill="#EEF5FC" stroke="#D9E4EC"/><rect x="61" y="338" width="46" height="34" rx="17" fill="#E4F3F3" stroke="#E4F3F3"/><text x="84.0" y="362" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">2</text><text x="131" y="361" font-size="28" fill="#182D42" font-weight="700" text-anchor="start">GRUB</text><text x="131" y="398" font-size="22" fill="#52677B" font-weight="400" text-anchor="start">Le chargeur choisit et charge le noyau et l’initramfs.</text><path d="M500 433 V455" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="464" width="920" height="108" rx="18" fill="#E4F3F3" stroke="#D9E4EC"/><rect x="61" y="484" width="46" height="34" rx="17" fill="#E4F3F3" stroke="#E4F3F3"/><text x="84.0" y="508" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">3</text><text x="131" y="507" font-size="28" fill="#182D42" font-weight="700" text-anchor="start">Noyau + initramfs</text><text x="131" y="544" font-size="22" fill="#52677B" font-weight="400" text-anchor="start">Le noyau démarre ; l’initramfs aide à accéder à la racine.</text><path d="M500 579 V601" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="610" width="920" height="108" rx="18" fill="#E4F3F3" stroke="#D9E4EC"/><rect x="61" y="630" width="46" height="34" rx="17" fill="#E4F3F3" stroke="#E4F3F3"/><text x="84.0" y="654" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">4</text><text x="131" y="653" font-size="28" fill="#182D42" font-weight="700" text-anchor="start">systemd · PID 1</text><text x="131" y="690" font-size="22" fill="#52677B" font-weight="400" text-anchor="start">Sur la racine définitive, systemd organise les services.</text><path d="M500 726 V756 M260 756 H740 M260 756 V787" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M740 756 V787" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="802" width="445" height="113" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="62" y="843" font-size="26" fill="#007E87" font-weight="700" text-anchor="start">Services disponibles</text><text x="62" y="882" font-size="23" fill="#52677B" font-weight="400" text-anchor="start">Réseau, SSH, journaux…</text><rect x="515" y="802" width="445" height="113" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="537" y="843" font-size="26" fill="#007E87" font-weight="700" text-anchor="start">Connexion possible</text><text x="537" y="882" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Console ou interface graphique</text><text x="40" y="967" font-size="22" fill="#182D42" font-weight="600" text-anchor="start">systemd lance les unités selon leurs dépendances, souvent en parallèle.</text><text x="40" y="1004" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Repère : firmware → chargeur → noyau → initialisation → système utilisable.</text></g></svg>