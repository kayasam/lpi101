<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="940" viewBox="0 0 1000 940" role="img" aria-labelledby="title desc"><title id="title">Les flux : lire, produire, signaler</title><desc id="desc">Trois canaux distincts pour comprendre redirections et tubes.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#007E87"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#AD5B18"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="998" height="938" rx="24" fill="#FBFCFE" stroke="#D9E4EC"/><text x="40" y="49" font-size="16" fill="#007E87" font-weight="700" text-anchor="start">LPI 101  /  REPÈRE VISUEL</text><text x="40" y="96" font-size="34" fill="#182D42" font-weight="700" text-anchor="start">Les flux : lire, produire, signaler</text><text x="40" y="132" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Trois canaux distincts pour comprendre redirections et tubes.</text><rect x="40" y="164" width="176" height="34" rx="17" fill="#E4F3F3" stroke="#E4F3F3"/><text x="128.0" y="188" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">01  LES FLUX</text><rect x="40" y="238" width="230" height="108" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="61" y="276" font-size="23" fill="#182D42" font-weight="650" text-anchor="start">Clavier ou fichier</text><text x="61" y="310" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Données à lire</text><rect x="373" y="238" width="236" height="108" rx="18" fill="#E4F3F3" stroke="#ABD3D5"/><text x="491" y="282" font-size="27" fill="#007E87" font-weight="700" text-anchor="middle">Commande</text><text x="491" y="315" font-size="19" fill="#52677B" font-weight="400" text-anchor="middle">en cours d’exécution</text><path d="M275 292 H365" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="320" y="269" font-size="22" fill="#007E87" font-weight="700" text-anchor="middle">0</text><text x="320" y="326" font-size="19" fill="#007E87" font-weight="600" text-anchor="middle">stdin</text><rect x="748" y="196" width="212" height="90" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="768" y="232" font-size="23" fill="#182D42" font-weight="650" text-anchor="start">Résultat normal</text><text x="768" y="263" font-size="20" fill="#52677B" font-weight="400" text-anchor="start">Écran ou fichier</text><path d="M614 267 H677 V241 H739" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="665" y="209" font-size="20" fill="#007E87" font-weight="650" text-anchor="middle">stdout · 1</text><rect x="748" y="332" width="212" height="90" rx="18" fill="#FFF7EF" stroke="#E9C9AA"/><text x="768" y="368" font-size="21" fill="#AD5B18" font-weight="650" text-anchor="start">Messages d’erreur</text><text x="768" y="399" font-size="20" fill="#52677B" font-weight="400" text-anchor="start">Écran ou fichier</text><path d="M614 316 H677 V377 H739" fill="none" stroke="#AD5B18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/><text x="665" y="414" font-size="20" fill="#AD5B18" font-weight="650" text-anchor="middle">stderr · 2</text><rect x="40" y="454" width="920" height="66" rx="12" fill="#FFFFFF" stroke="#D9E4EC"/><text x="60" y="495" font-size="27" fill="#007E87" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">&gt;</text><text x="94" y="495" font-size="22" fill="#52677B" font-weight="400" text-anchor="start">redirige stdout</text><text x="353" y="495" font-size="27" fill="#AD5B18" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">2&gt;</text><text x="400" y="495" font-size="22" fill="#52677B" font-weight="400" text-anchor="start">redirige stderr</text><text x="678" y="495" font-size="27" fill="#007E87" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">&lt;</text><text x="715" y="495" font-size="22" fill="#52677B" font-weight="400" text-anchor="start">alimente stdin</text><rect x="40" y="555" width="224" height="34" rx="17" fill="#E4F3F3" stroke="#E4F3F3"/><text x="152.0" y="579" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">02  LE TUBE  |</text><text x="40" y="620" font-size="27" fill="#182D42" font-weight="600" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">printf &#x27;Alice\nBob\n&#x27; | wc -l</text><rect x="40" y="660" width="244" height="106" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="162" y="701" font-size="28" fill="#182D42" font-weight="650" text-anchor="middle" font-family="Cascadia Code,Consolas,monospace">printf</text><text x="162" y="735" font-size="21" fill="#52677B" font-weight="400" text-anchor="middle">Produit deux lignes</text><path d="M290 711 H479" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="385" y="683" font-size="20" fill="#007E87" font-weight="650" text-anchor="middle">stdout → stdin</text><rect x="339" y="728" width="90" height="34" rx="17" fill="#E4F3F3" stroke="#E4F3F3"/><text x="384.0" y="752" font-size="18" fill="#007E87" font-weight="600" text-anchor="middle">tube |</text><rect x="490" y="660" width="250" height="106" rx="18" fill="#E4F3F3" stroke="#ABD3D5"/><text x="615" y="701" font-size="28" fill="#007E87" font-weight="650" text-anchor="middle" font-family="Cascadia Code,Consolas,monospace">wc -l</text><text x="615" y="735" font-size="21" fill="#52677B" font-weight="400" text-anchor="middle">Compte les lignes</text><path d="M747 711 H805" fill="none" stroke="#007E87" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="817" y="660" width="143" height="106" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="889" y="707" font-size="38" fill="#007E87" font-weight="700" text-anchor="middle" font-family="Cascadia Code,Consolas,monospace">2</text><text x="889" y="739" font-size="18" fill="#52677B" font-weight="400" text-anchor="middle">à l’écran</text><rect x="40" y="808" width="920" height="88" rx="14" fill="#EEF5FC" stroke="#C9DCEE"/><text x="62" y="844" font-size="22" fill="#306CB5" font-weight="700" text-anchor="start">À retenir</text><text x="62" y="875" font-size="23" fill="#182D42" font-weight="400" text-anchor="start">Par défaut, le tube transmet stdout. Les erreurs restent séparées.</text></g></svg>