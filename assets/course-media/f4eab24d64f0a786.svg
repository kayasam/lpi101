<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title desc"><title id="title">Lire les permissions sans mélanger les rôles</title><desc id="desc">Exemple : -rwxr-xr--, soit 754 pour les neuf bits de permissions.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#007E87"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L8 4.5 L0 9Z" fill="#AD5B18"/></marker></defs><g font-family="Segoe UI,Arial,sans-serif"><rect x="1" y="1" width="998" height="928" rx="24" fill="#FBFCFE" stroke="#D9E4EC"/><text x="40" y="49" font-size="16" fill="#007E87" font-weight="700" text-anchor="start">LPI 101  /  REPÈRE VISUEL</text><text x="40" y="96" font-size="34" fill="#182D42" font-weight="700" text-anchor="start">Lire les permissions sans mélanger les rôles</text><text x="40" y="132" font-size="21" fill="#52677B" font-weight="400" text-anchor="start">Exemple : -rwxr-xr--, soit 754 pour les neuf bits de permissions.</text><rect x="40" y="175" width="118" height="155" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="99" y="222" font-size="21" fill="#52677B" font-weight="600" text-anchor="middle">Type</text><text x="99" y="278" font-size="43" fill="#182D42" font-weight="700" text-anchor="middle" font-family="Cascadia Code,Consolas,monospace">-</text><text x="99" y="310" font-size="20" fill="#52677B" font-weight="400" text-anchor="middle">fichier</text><rect x="178" y="175" width="248" height="155" rx="18" fill="#E4F3F3" stroke="#D9E4EC"/><text x="302" y="222" font-size="23" fill="#007E87" font-weight="650" text-anchor="middle">Propriétaire</text><text x="302" y="275" font-size="43" fill="#007E87" font-weight="700" text-anchor="middle" font-family="Cascadia Code,Consolas,monospace">rwx</text><text x="302" y="310" font-size="20" fill="#52677B" font-weight="400" text-anchor="middle">4 + 2 + 1</text><rect x="445" y="175" width="248" height="155" rx="18" fill="#EEF5FC" stroke="#D9E4EC"/><text x="569" y="222" font-size="23" fill="#306CB5" font-weight="650" text-anchor="middle">Groupe</text><text x="569" y="275" font-size="43" fill="#306CB5" font-weight="700" text-anchor="middle" font-family="Cascadia Code,Consolas,monospace">r-x</text><text x="569" y="310" font-size="20" fill="#52677B" font-weight="400" text-anchor="middle">4 + 0 + 1</text><rect x="712" y="175" width="248" height="155" rx="18" fill="#FFF7EF" stroke="#D9E4EC"/><text x="836" y="222" font-size="23" fill="#AD5B18" font-weight="650" text-anchor="middle">Autres</text><text x="836" y="275" font-size="43" fill="#AD5B18" font-weight="700" text-anchor="middle" font-family="Cascadia Code,Consolas,monospace">r--</text><text x="836" y="310" font-size="20" fill="#52677B" font-weight="400" text-anchor="middle">4 + 0 + 0</text><text x="40" y="382" font-size="25" fill="#182D42" font-weight="650" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">r = 4     w = 2     x = 1     — = droit absent</text><text x="40" y="440" font-size="27" fill="#182D42" font-weight="700" text-anchor="start">La même lettre change de sens selon l’objet.</text><rect x="40" y="467" width="920" height="322" rx="18" fill="#FFFFFF" stroke="#D9E4EC"/><text x="70" y="510" font-size="21" fill="#52677B" font-weight="650" text-anchor="start">Droit</text><text x="240" y="510" font-size="23" fill="#182D42" font-weight="650" text-anchor="start">Sur un fichier</text><text x="580" y="510" font-size="23" fill="#182D42" font-weight="650" text-anchor="start">Sur un répertoire</text><path d="M62 532 H938" fill="none" stroke="#D9E4EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="570" font-size="32" fill="#007E87" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">r</text><text x="240" y="570" font-size="22" fill="#182D42" font-weight="400" text-anchor="start">Lire son contenu</text><text x="580" y="570" font-size="22" fill="#182D42" font-weight="400" text-anchor="start">Lister les noms</text><path d="M62 612 H938" fill="none" stroke="#D9E4EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="650" font-size="32" fill="#007E87" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">w</text><text x="240" y="650" font-size="22" fill="#182D42" font-weight="400" text-anchor="start">Modifier son contenu</text><text x="580" y="650" font-size="22" fill="#182D42" font-weight="400" text-anchor="start">Créer / supprimer des entrées</text><path d="M62 692 H938" fill="none" stroke="#D9E4EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="80" y="730" font-size="32" fill="#007E87" font-weight="700" text-anchor="start" font-family="Cascadia Code,Consolas,monospace">x</text><text x="240" y="730" font-size="22" fill="#182D42" font-weight="400" text-anchor="start">Lancer le programme</text><text x="580" y="730" font-size="22" fill="#182D42" font-weight="400" text-anchor="start">Traverser le répertoire</text><rect x="40" y="820" width="920" height="73" rx="14" fill="#EEF5FC" stroke="#C9DCEE"/><text x="62" y="850" font-size="21" fill="#306CB5" font-weight="600" text-anchor="start">Répertoire : w s’utilise généralement avec x pour créer ou supprimer.</text><text x="62" y="879" font-size="20" fill="#52677B" font-weight="400" text-anchor="start">Les permissions classiques choisissent une catégorie : propriétaire, groupe ou autres.</text></g></svg>